# Build properties for deployment.
[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"


# region Core Project Settings and Metadata

[project]
name = "django-adminlte2-pdq"
description = "A Django app that takes all of the work out of making a beautiful and functional web application pretty darn quickly (PDQ) using the AdminLTE2 theme."
readme = "README.md"
authors = [
    { name = "David Barnes", email = "barnesdavidj@gmail.com" },
]
maintainers = [
    { name = "David Barnes", email = "barnesdavidj@gmail.com" },
    { name = "Brandon Rodriguez", email = "brodriguez8774@gmail.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = [
    "adminlte2",
    "django",
    "fast",
    "pdq",
    "rapid",
    "speed",
    "style",
    "theme",
]
requires-python = ">=3.7"
dependencies = [
    "django >= 3.2.0",
]
dynamic = ["version"]


[project.optional-dependencies]
dev = [
    "colorama",
    "coverage",
    "ruff",
]
doc = [
    "doc8",
    "pip-tools",
    "rstcheck",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
]
test = [
    "coverage",
    "django-expanded-test-cases",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-subtests",
    "pytest-xdist",
]


[project.urls]
Homepage = "https://github.com/djbarnes/django-adminlte2-pdq"


# endregion Core Project Settings and Metadata


# region Third-Party Package Settings

# Flit build settings
[tool.flit.module]
name = "adminlte2_pdq"

# "uv" development environment settings.
[tool.uv]
# The development environment (`uv sync --all-extras`) uses a recent Python. The package itself supports Python 3.7
# and later (requires-python); tox tests the older versions.
environments = ["python_version >= '3.12'"]

# "Ruff" formatter and linter settings.
[tool.ruff]
line-length = 120
# The oldest Python to support comes from requires-python.
# Python files only; code examples in Markdown keep the docs' style.
extend-exclude = ["*.md", "docs/build"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, pep8-naming, Ruff's pylint rules, and its Django rules.
select = ["F", "E", "W", "B", "N", "PL", "DJ"]
ignore = [
    # The "too many ..." checks, which the project's pylint configuration also disabled.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Magic values in comparisons (an optional pylint extension).
    "PLR2004",
    # `else: if` instead of `elif` (pylint's no-else checks were disabled).
    "PLR5501",
    # The middleware's warnings point at the middleware, as before.
    "B028",
]

[tool.ruff.lint.pep8-naming]
# Test assertion helpers follow unittest's naming; TestFormSets holds a formset class.
extend-ignore-names = ["assert*", "TestFormSets"]

[tool.ruff.lint.per-file-ignores]
# These modules re-export names for `from adminlte2_pdq.constants import ...` and `from adminlte2_pdq.views import ...`.
"adminlte2_pdq/constants/__init__.py" = ["F401"]
"adminlte2_pdq/views/__init__.py" = ["F401"]
# Tests set attributes on views and functions by name, and import inside test methods to load settings fresh.
"tests/**" = ["B010", "PLC0415"]

# Esbonio settings
[tool.esbonio.sphinx]
pythonCommand = ["uv", "run", "python"]

# endregion Third-Party Package Settings


# region Testing Settings

[tool.pytest.ini_options]
python_files = ["tests.py", "tests/test_*.py"]

DJANGO_SETTINGS_MODULE = "tests.django_adminlte2_pdq.django_test_project.settings"
pythonpath = "."
# Constructed as
#   {action}:{message}:{category}:{module}:{lineno}
#
# For more details, see:
#   https://docs.pytest.org/en/stable/how-to/capture-warnings.html
#   https://docs.python.org/3/library/warnings.html#warning-filter
#   https://stackoverflow.com/questions/57925071/how-do-i-avoid-getting-deprecationwarning-from-inside-dependencies-with-pytest
filterwarnings = ""


[tool.coverage.run]
branch = true
omit = [
    # Omit the virtual environment.
    "./.venv/*",
    # Omit the test folders.
    "*/tests/*",
    "*/tests.py",
    # Omit the migration folders.
    "*/migrations/*",
    # Omit django files.
    "*/manage.py",
    "*/wsgi.py",
    "*/settings.py",
    "*/asgi.py",
    # Omit management commands.
    "*/management/commands/*.py",
    # Omit init files.
    "*/__init__.py",
    # Omit Testing Scripts.
    "./runtests.py",
]

[tool.coverage.report]
# Lines that only run when a module is run as a script (python -m ...); main() itself is tested.
exclude_also = [
    'if __name__ == "__main__":',
]

# endregion Testing Settings
